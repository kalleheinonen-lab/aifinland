[project]
name = "ai-finland-db"
version = "0.1.0"
description = "AI Finland Matchmaking Platform - Database Layer"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31.0",
    "alembic>=1.18.0",
    "uuid-utils>=0.16.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.0",
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (e2e shell-out tests, deselect with -m 'not slow')",
]
