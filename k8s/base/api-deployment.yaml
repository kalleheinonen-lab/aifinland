---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ai-finland-app
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: ai-finland
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: ai-finland
        app.kubernetes.io/component: backend
      annotations:
        openbao.io/agent-inject: "true"
        openbao.io/role: "api"
        openbao.io/agent-inject-secret-db-creds: "secret/data/ai-finland/db-creds"
    spec:
      serviceAccountName: api
      containers:
        - name: api
          image: PLACEHOLDER_API_IMAGE:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ai-finland-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-finland-db-credentials
                  key: password
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: ai-finland-db-credentials
                  key: username
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-finland-valkey-credentials
                  key: password
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
