name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (web)
        run: pnpm --filter @ai-finland/web lint

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dev dependencies
        working-directory: apps/api
        run: pip install --quiet -r requirements.txt

      - name: Lint (api)
        working-directory: apps/api
        run: ruff check .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (web)
        run: pnpm --filter @ai-finland/web typecheck

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dev dependencies
        working-directory: apps/api
        run: pip install --quiet -r requirements.txt

      - name: Typecheck (api)
        working-directory: apps/api
        run: mypy src/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (web)
        run: pnpm --filter @ai-finland/web test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dev dependencies
        working-directory: apps/api
        run: pip install --quiet -r requirements.txt

      - name: Test (api) — AC-11 end-to-end quality gate
        working-directory: apps/api
        run: pytest

  docker-verify:
    name: Docker verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build web Docker image
        run: docker build --tag ai-finland/web:ci apps/web

      - name: Build api Docker image
        run: docker build --tag ai-finland/api:ci apps/api

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"

      - name: Terraform init (local backend)
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate
