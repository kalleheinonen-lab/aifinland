---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ai-finland-app
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: ai-finland
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: ai-finland
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: web
      containers:
        - name: web
          image: PLACEHOLDER_WEB_IMAGE:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: ai-finland-config
                  key: ENVIRONMENT
          resources:
            requests:
              memory: "128Mi"
              cpu: "125m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
