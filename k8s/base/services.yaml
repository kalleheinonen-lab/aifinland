---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ai-finland-app
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: ai-finland
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ai-finland-app
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: ai-finland
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
