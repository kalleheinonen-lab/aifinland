# Helm values for Grafana Loki chart
# Chart: grafana/loki
# Deploy to ai-finland-observability namespace
#
# Install:
#   helm install loki grafana/loki \
#     --namespace ai-finland-observability \
#     --values loki-values.yaml

# Deployment mode: single-binary for dev, scalable for prod
# Override with --set deploymentMode=SimpleScalable for production
deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  nodeSelector:
    role: observability
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  persistence:
    enabled: true
    size: 50Gi

# For production: scalable mode configuration
# Uncomment and set deploymentMode: SimpleScalable
# read:
#   replicas: 2
#   nodeSelector:
#     role: observability
# write:
#   replicas: 2
#   nodeSelector:
#     role: observability
# backend:
#   replicas: 2
#   nodeSelector:
#     role: observability

loki:
  # Authentication disabled for internal cluster use
  auth_enabled: false

  # Schema configuration
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  # Storage configuration
  # Dev: filesystem; Prod: object storage (override via environment values)
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  # For production with UpCloud Object Storage:
  # storage:
  #   type: s3
  #   s3:
  #     endpoint: <object-storage-endpoint>
  #     bucketnames: ai-finland-loki-chunks
  #     access_key_id: ${LOKI_S3_ACCESS_KEY_ID}
  #     secret_access_key: ${LOKI_S3_SECRET_ACCESS_KEY}
  #     s3ForcePathStyle: true

  # Structured metadata and log parsing
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 2160h  # 90 days default for access logs

  # Retention configuration
  # Access logs: 90 days (2160h)
  # Audit logs: 730 days (17520h) -- enforced via stream-level retention
  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 150
    delete_request_store: filesystem

  # Per-tenant/stream retention overrides
  # Audit logs (labeled log_type=audit) retained for 730 days
  overrides:
    defaults:
      retention_period: 2160h  # 90 days for access logs
      retention_stream:
        - selector: '{log_type="audit"}'
          priority: 1
          period: 17520h  # 730 days for audit logs

  # Server configuration for structured JSON log parsing
  server:
    http_listen_port: 3100
    grpc_listen_port: 9096
    log_level: info
    log_format: json

# Gateway configuration
gateway:
  enabled: true
  nodeSelector:
    role: observability

# Monitoring
monitoring:
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false

# Disable test pod
test:
  enabled: false
