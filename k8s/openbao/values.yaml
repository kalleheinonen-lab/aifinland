# Helm values for OpenBao (openbao/openbao chart)
# Deploy to ai-finland-secrets namespace
# API-compatible with HashiCorp Vault; uses MPL 2.0 license.

global:
  enabled: true
  namespace: ai-finland-secrets

server:
  enabled: true
  image:
    repository: quay.io/openbao/openbao
    tag: "2.1.0"

  # HA mode with Raft integrated storage
  ha:
    enabled: true
    replicas: 1  # 1 replica for dev; increase to 3 for production
    raft:
      enabled: true
      config: |
        ui = false

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/openbao/data"
        }

        service_registration "kubernetes" {}

        # Audit logging -- all requests and responses are logged
        audit {
          type = "file"
          path = "file"
          options = {
            file_path = "/openbao/audit/audit.log"
          }
        }

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # Persistent volume for Raft storage
  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: null  # use cluster default

  # Audit log volume
  auditStorage:
    enabled: true
    size: 5Gi
    storageClass: null  # use cluster default

  # Service account for OpenBao server
  serviceAccount:
    create: true
    name: openbao

  # Kubernetes auth method -- enabled so application pods can authenticate
  authDelegator:
    enabled: true

# Injector sidecar -- injects secrets into application pods
injector:
  enabled: true
  replicas: 1
  image:
    repository: quay.io/openbao/openbao-k8s
    tag: "2.1.0"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "250m"
  # The injector watches all namespaces for pods with openbao annotations
  namespaceSelector:
    matchLabels:
      openbao-injection: enabled

# UI disabled in production (security best practice)
ui:
  enabled: false
