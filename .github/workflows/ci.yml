name: CI
# AC-11 [e2e]: WHEN ci.yml runs against the scaffolded monorepo THE SYSTEM SHALL
# complete all quality jobs (lint, typecheck, test, docker-verify, terraform-validate)
# end-to-end with nothing mocked.

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

jobs:
  # AC-10 [e2e]: WHEN make ci executes against the complete codebase THE SYSTEM
  # SHALL pass lint, typecheck, all tests, and the RLS coverage gate end-to-end
  # with nothing mocked.
  quality-db:
    name: Quality - DB layer (make ci)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Run make ci (AC-10 - complete codebase verification)
        run: make ci

  quality-api:
    name: Quality - API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: apps/api
        run: pip install --quiet -r requirements.txt

      - name: Lint (ruff)
        working-directory: apps/api
        run: ruff check .

      - name: Typecheck (mypy)
        working-directory: apps/api
        run: mypy src/

      - name: Test (pytest)
        working-directory: apps/api
        run: pytest

  quality-web:
    name: Quality - Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (oxlint)
        working-directory: apps/web
        run: npx oxlint .

      - name: Typecheck (tsc)
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Test (vitest)
        working-directory: apps/web
        run: npx vitest run

  docker-verify:
    name: Docker verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build --tag ai-finland/api:ci apps/api

      - name: Build Web Docker image
        run: docker build --tag ai-finland/web:ci -f apps/web/Dockerfile .

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check

      - name: Set up Python for Checkov
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Checkov
        run: |
          pip install --quiet checkov
          checkov -d terraform/ --framework terraform --quiet --compact
