name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build-api:
    name: Build & Push API
    uses: ./.github/workflows/_build-push.yml
    with:
      app: api
      dockerfile: apps/api/Dockerfile
    secrets: inherit

  build-web:
    name: Build & Push Web
    uses: ./.github/workflows/_build-push.yml
    with:
      app: web
      dockerfile: apps/web/Dockerfile
    secrets: inherit

  build-worker:
    name: Build & Push Worker
    uses: ./.github/workflows/_build-push.yml
    with:
      app: worker
      dockerfile: apps/worker/Dockerfile
    secrets: inherit

  deploy-dev:
    name: Deploy to Dev
    needs: [build-api, build-web, build-worker]
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: dev
      api_image: ${{ needs.build-api.outputs.image }}
      web_image: ${{ needs.build-web.outputs.image }}
      worker_image: ${{ needs.build-worker.outputs.image }}
    secrets: inherit

