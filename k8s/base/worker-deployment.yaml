---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ai-finland-app
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: ai-finland
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: ai-finland
        app.kubernetes.io/component: worker
      annotations:
        openbao.io/agent-inject: "true"
        openbao.io/role: "worker"
        openbao.io/agent-inject-secret-db-creds: "secret/data/ai-finland/db-creds"
    spec:
      serviceAccountName: worker
      containers:
        - name: worker
          image: PLACEHOLDER_WORKER_IMAGE:latest
          envFrom:
            - configMapRef:
                name: ai-finland-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-finland-db-credentials
                  key: password
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: ai-finland-db-credentials
                  key: username
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-finland-valkey-credentials
                  key: password
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
